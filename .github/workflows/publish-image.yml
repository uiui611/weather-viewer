# 概要:
#   weather-viewer の PR をビルド検証し、main のイメージを GHCR に公開して更新 webhook を送信します。
# 前提条件:
#   - このファイルを weather-viewer/.github/workflows/publish-image.yml に配置します。
#   - notify-deployment.mjs を weather-viewer/.github/scripts/notify-deployment.mjs に配置します。
#   - deploy.mizu-mizu.info に OIDC 認証付き受信サービスと公開 TLS 証明書を用意します。
# 注意事項:
#   - webhook の HTTP 202 で成功とし、Pod の更新完了は待ちません。
#   - main タグは可変です。GHCR 公開と通知は同じ concurrency 範囲で実行します。
name: Build, publish and deploy container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/uiui611/weather-viewer

jobs:
  build:
    name: Validate pull request image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test deployment notification
        run: node --test .github/scripts/notify-deployment.test.mjs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false

  publish:
    name: Publish main image and request deployment
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: ghcr-main
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test deployment notification
        run: node --test .github/scripts/notify-deployment.test.mjs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,format=long
      - name: Verify this commit is still the main head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/notify-deployment.mjs --check-main
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=weather-viewer-main
          cache-to: type=gha,mode=max,scope=weather-viewer-main
      - name: Request deployment update
        timeout-minutes: 4
        env:
          DEPLOY_SERVICE_ID: weather-viewer
          DEPLOY_WEBHOOK_URL: https://deploy.mizu-mizu.info/v1/deployments
          DEPLOY_OIDC_AUDIENCE: https://deploy.mizu-mizu.info
        run: node .github/scripts/notify-deployment.mjs
